<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>健康管理 Dashboard</title>
<link rel="stylesheet" href="css/app.css">
<script src="vendor/chart.umd.min.js" defer></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="login" class="hidden">
  <div class="box">
    <h2>健康管理 Dashboard</h2>
    <p class="muted">請使用已授權的 Google 帳號登入</p>
    <div id="gsi-btn" style="display:flex;justify-content:center;margin:18px 0"></div>
    <p id="login-msg" class="muted"></p>
  </div>
</div>

<header class="top">
  <h1>健康管理 Dashboard</h1>
  <nav id="nav">
    <a href="#overview" data-view="overview">總覽</a>
    <a href="#trends" data-view="trends">體重與身體組成</a>
    <a href="#nutrition" data-view="nutrition">飲食與運動</a>
    <a href="#records" data-view="records">資料管理</a>
    <a href="#tasks" data-view="tasks">作業排程</a>
    <a href="#reports" data-view="reports">報表中心</a>
    <a href="#goals" data-view="goals">目標</a>
    <a href="#settings" data-view="settings">設定</a>
  </nav>
  <div class="who"><span id="who"></span><button id="logout">登出</button></div>
</header>

<main id="view"></main>
<div id="toast"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
